name: Complete Lessons Cron

on:
  schedule:
    - cron: "*/2 * * * *"   # roda a cada 2 minutos
  workflow_dispatch:

jobs:
  run-cron:
    runs-on: ubuntu-latest

    steps:
      - name: Call complete lessons endpoint
        run: |
          curl -X GET https://auto-escolado-brasil.vercel.app/api/complete-lessons \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
